  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"background:#06134a;color:#fff;padding:clamp(80px,10vw,140px) 0\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:clamp(40px,5vw,64px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px;max-width:760px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ec3b30\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Expertise<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em;text-wrap:balance\">Three departments. One integrated team.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:420px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.75)\">Each department brings deep specialist knowledge. Together they cover the complete electrical lifecycle of a facility.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px\">\n        <sc-for list=\"{{ panels }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <a href=\"{{ d.href }}\" data-reveal=\"\" sc-camel-on-mouse-enter=\"{{ d.enter }}\" sc-camel-on-mouse-leave=\"{{ d.leave }}\" style=\"position:relative;display:block;aspect-ratio:3/4;max-height:640px;width:100%;overflow:hidden;color:#fff;text-decoration:none;background:#0a1a5c\">\n            <img src=\"{{ d.img }}\" alt=\"{{ d.full }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale({{ d.zoom }});transition:transform 1.4s cubic-bezier(.2,.7,.2,1)\">\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,4 justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(40px,5vw,64px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Selected projects<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em;max-width:760px;text-wrap:balance\">Over 6,000 projects, from courthouses to nuclear generating stations.<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#/projects\" style=\"display:flex;align-items:center;gap:10px;color:#06134a;text-decoration:none;font-weight:600;font-size:15px;padding-bottom:6px;border-bottom:1.5px solid #ec3b30\" style-hover=\"color:#021e7f\">All projects<span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(40px,4vw,56px) 24px\">\n        <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <button data-reveal=\"\" sc-camel-on-click=\"{{ p.open }}\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-mouse-leave=\"{{ p.leave }}\" style=\"grid-column:{{ p.span }};background:none;border:0;padding:0;text-align:left;cursor:pointer;color:#06134a;display:flex;flex-direction:column;gap:20px;min-width:0\">\n            <div style=\"position:relative;overflow:hidden;width:100%;aspect-ratio:{{ p.ar }};background:#0a1a5c\">\n              <sc-if value=\"{{ p.hasImg }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ p.img }}\" alt=\"{{ p.title }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale({{ p.zoom }});transition:transform 1.2s cubic-bezier(.2,.7,.2,1)\"><\u002Fsc-if>\n              <sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;inset:0;padding:clamp(24px,2.4vw,36px);display:flex;flex-direction:column;justify-content:space-between;color:#fff;background-color:#0a1a5c;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)\">{{ p.discLabel }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:clamp(40px,4.4vw,68px);line-height:1;font-weight:500;letter-spacing:-.035em;color:#ec3b30\">{{ p.stat.v }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.8)\">{{ p.stat.l }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#021e7f\"><span>{{ p.discLabel }}<\u002Fspan><span style=\"color:#8a90a3\">{{ p.cat }}<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0;font-weight:500;font-size:{{ p.tsize }};line-height:1.15;letter-spacing:-.018em;text-wrap:balance\">{{ p.title }}<\u002Fh3>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:15px;color:#525a70\"><span>{{ p.place }}<\u002Fspan><span style=\"color:#06134a;transform:translateX({{ p.ax }});transition:transform .3s ease\">→<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Home approach\" style=\"background:#fbfcfd;padding:clamp(80px,10vw,140px) 0;border-top:1px solid rgba(6,19,74,.08)\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px clamp(40px,6vw,96px);align-items:end;margin-bottom:clamp(48px,6vw,80px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Why Algal<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em;text-wrap:balance\">One firm, every phase of the project.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#525a70;max-width:560px;text-wrap:pretty\">Our team supports clients from preliminary studies and options through design, contract administration, commissioning and close-out. Clients deal with one accountable consultant from start to finish.<\u002Fp>\n      <\u002Fdiv>\n      <ol data-reveal=\"\" style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0\">\n        <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"6\">\n          <li style=\"border-top:1px solid rgba(6,19,74,.18);padding:24px 24px 24px 0;display:flex;flex-direction:column;gap:14px;position:relative\">\n            <span style=\"position:absolute;top:-4px;left:0;width:7px;height:7px;background:#ec3b30\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#021e7f;letter-spacing:.08em\">{{ ph.n }}<\u002Fspan>\n            <span style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">{{ ph.t }}<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.55;color:#525a70\">{{ ph.d }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Home nuclear\" style=\"position:relative;background:#06134a;color:#fff;overflow:hidden\">\n    <img src=\"https://www.algal.ca/Images/Services/n-2.jpg\" alt=\"Nuclear engineering\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,10,42,.96) 0%,rgba(3,10,42,.8) 45%,rgba(3,10,42,.2) 100%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1400px;margin:0 auto;padding:clamp(96px,12vw,180px) clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"max-width:720px;display:flex;flex-direction:column;gap:26px\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ec3b30\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Nuclear Engineering<\u002Fdiv>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.6vw,66px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance\">Supporting the next generation of nuclear power in Ontario.<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:rgba(255,255,255,.82);text-wrap:pretty\">Algal works inside and outside the protected areas of Ontario Power Generation's Darlington and Pickering stations. We provide consulting services to the Darlington New Nuclear Project and the implementation of a Small Modular Reactor (SMR).<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <span style=\"font- 4,.16);font-size:clamp(19px,1.7vw,24px);font-weight:500;letter-spacing:-.012em\"><span>{{ sc.t }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a90a3\">{{ sc.n }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:28px;padding:clamp(28px,3vw,44px);background:#06134a;color:#fff\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ec3b30\">Generating stations served<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 28px\">\n            <sc-for list=\"{{ stations }}\" as=\"gs\" hint-placeholder-count=\"6\">\n              <div style=\"padding:16px 0;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:18px;font-weight:500\">{{ gs.n }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(255,255,255,.65);letter-spacing:.06em\">{{ gs.t }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\">Quality assurance<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));border:1px solid rgba(6,19,74,.16)\">\n            <sc-for list=\"{{ quality }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"padding:22px;border-right:1px solid rgba(6,19,74,.16);display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:22px;font-weight:600;letter-spacing:-.015em\">{{ q.c }}<\u002Fspan><span style=\"font-size:14px;line-height:1.45;color:#525a70\">{{ q.d }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#525a70\">Certified and audited programs govern project planning, management, scheduling and budget control. Each project still gets its own execution plan, built around the client's requirements, risks and site conditions.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ INNER PAGE HERO ============ -->\n<sc-if value=\"{{ isInner }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Page hero\" style=\"position:relative;min-height:{{ heroMinH }};background:#06134a;color:#fff;overflow:hidden;display:flex;align-items:flex-end\">\n    <sc-if value=\"{{ hero.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n      <img src=\"{{ hero.img }}\" alt=\"{{ hero.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n      <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,42,.7) 0%,rgba(3,10,42,.3) 40%,rgba(3,10,42,.9) 100%)\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hero.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"position:relative;max-width:1400px;margin:0 auto;padding:190px clamp(20px,5vw,64px) clamp(48px,6vw,80px);box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)\"><a href=\"#/\" style=\"color:rgba(255,255,255,.75);text-decoration:none\" style-hover=\"color:#fff\">Home<\u002Fa><span>/<\u002Fspan><span style=\"color:#ec3b30\">{{ hero.crumb }}<\u002Fspan><\u002Fdiv>\n      <h1 style=\"margin:0;font-weight:500;font-size:clamp(40px,5.6vw,84px);line-height:1;letter-spacing:-.035em;max-width:1100px;text-wrap:balance\">{{ hero.title }}<\u002Fh1>\n      <p style=\"margin:0;max-width:680px;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:rgba(255,255,255,.85);text-wrap:pretty\">{{ hero.lead }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ ABOUT ============ -->\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"sec-story\" style=\"padding:clamp(80px,10vw,140px) 0;background:#f2f4f8;scroll-margin-top:129px\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px clamp(40px,6vw,96px);align-items:start\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Our story<\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:28px;max-width:900px\">\n          <p style=\"margin:0;font-size:clamp(26px,2.8vw,40px);line-height:1.2;letter-spacing:-.022em;font-weight:500;text-wrap:pretty\">Founded in 1992 as Algal &amp; Associates, the firm was reorganized as Algal Engineering Ltd. in 2004. It has grown steadily into a full-service consultancy since.<\u002Fp>\n          <p style=\"margin:0;font-size:18px;line-height:1.65;color:#525a70;text-wrap:pretty\">Over three decades, our portfolio has moved toward increasingly intricate and complex scopes across a wide range of industries. That experience lets us adapt to the needs of each client and sector. Our team supports clients through every phase of a project, from preliminary studies and options to project administration, commissioning and close-out.<\u002Fp>\n          <p style=\"margin:0;font-size:18px;line-height:1.65;color:#525a70;text-wrap:pretty\">Clients value this one-stop model above all else: one consultant who brings together electrical, communications, life safety, IT, security and building science design with critical instrumentation and control engineering.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:clamp(64px,8vw,112px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));border-top:1px solid rgba(6,19,74,.16)\">\n        <sc-for list=\"{{ timeline }}\" as=\"tl\" hint-placeholder-count=\"3\">\n          <div style=\"padding:28px 32px 0 0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:clamp(40px,4.6vw,68px);line-height:1;font-weight:500;letter-spacing:-.035em\">{{ tl.y }}<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.55;color:#525a70;max-width:320px\">{{ tl.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sec-values\" style=\"scroll-margin-top:129px;background:#06134a;color:#fff;padding:clamp(80px,10vw,140px) 0\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:22px;margin-bottom:clamp(40px,5vw,72px);max-width:820px\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ec3b30\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>What sets Algal apart<\u002Fdiv>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em;text-wrap:balance\">Built on experience, expertise, innovation and teamwork.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:1px solid rgba(255,255,255,.16);border-left:1px solid rgba(255,255,255,.16)\">\n        <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"padding:clamp(28px,3vw,40px);border-right:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:18px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#ec3b30;letter-spacing:.1em\">{{ v.n }} — {{ v.k }}<\u002Fspan>\n            <h3 style=\"margin:0;font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.015em\">{{ v.t }}<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.65;color:rgba(255,255,255,.75)\">{{ v.d }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sec-team\" style=\"scroll-margin-top:129px;padding:clamp(80px,10vw,140px) 0;background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(40px,5vw,64px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Leadership<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em\">Our management team<\u002Fh2>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(6,19,74,.18)\">\n        <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px clamp(32px,5vw,80px);padding:clamp(28px,3vw,40px) 0;border-bottom:1px solid rgba(6,19,74,.18)\">\n            <div style=\"display:flex;gap:24px;align-items:flex-start\">\n              <div style=\"flex:none;width:clamp(120px,12vw,168px);aspect-ratio:4/5;overflow:hidden;background:#dde1ea\"><img src=\"{{ m.photo }}\" alt=\"{{ m.name }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n              <h3 style=\"margin:0;font-size:clamp(24px,2.2vw,30px);font-weight:500;letter-spacing:-.02em;line-height:1.1\">{{ m.name }}<span style=\"color:#8a90a3;font-weight:400\">, {{ m.cred }}<\u002Fspan><\u002Fh3>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#021e7f\">{{ m.role }}<\u002Fspan>\n              <span style=\"font-size:15px;color:#525a70\">{{ m.tenure }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:14px;max-width:820px\">\n              <p style=\"margin:0;font-size:17px;line-height:1.65;color:#2a3147;text-wrap:pretty\">{{ m.bio }}<\u002Fp>\n              <sc-if value=\"{{ m.isOpen }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:16px;line-height:1.65;color:#525a70;text-wrap:pretty\">{{ m.more }}<\u002Fp><\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"align-self:flex-start;background:none;border:0;padding:0 0 4px;border-bottom:1.5px solid #ec3b30;font-weight:600;font-size:14.5px;color:#06134a;cursor:pointer\">{{ m.btn }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ EXPERTISE ============ -->\n<sc-if value=\"{{ isExpertise }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:sticky;top:129px;z-index:40;background:#fbfcfd;border-bottom:1px solid rgba(6,19,74,.12)\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%;display:flex;gap:clamp(20px,3vw,44px);overflow-x:auto\">\n      <sc-for list=\"{{ discTabs }}\" as=\"dt\" hint-placeholder-count=\"3\">\n        <a href=\"{{ dt.href }}\" style=\"flex:none;display:flex;align-items:center;gap:10px;height:64px;text-decoration:none;color:{{ dt.color }};font-weight:600;font-size:15px;box-shadow:inset 0 -2px 0 {{ dt.line }}\" style-hover=\"color:#06134a\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:#021e7f\">{{ dt.num }}<\u002Fspan>{{ dt.full }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <section style=\"padding:clamp(72px,9vw,128px) 0;background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px clamp(40px,6vw,96px);align-items:start;margin-bottom:clamp(56px,7vw,96px)\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>{{ disc.num }} — Overview<\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:900px\">\n          <p style=\"margin:0;font-size:clamp(24px,2.6vw,36px);line-height:1.25;letter-spacing:-.02em;font-weight:500;text-wrap:pretty\">{{ disc.statement }}<\u002Fp>\n          <p style=\"margin:0;font-size:18px;line-height:1.65;color:#525a70;text-wrap:pretty\">{{ disc.intro }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:clamp(48px,5vw,72px) 32px\">\n        <sc-for list=\"{{ disc.groups }}\" as=\"g\" hint-placeholder-count=\"6\">\n          <article data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:22px\">\n            <div style=\"aspect-ratio:16/10;overflow:hidden;background:#0a1a5c\"><img src=\"{{ g.img }}\" alt=\"{{ g.title }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#021e7f\">{{ g.n }}<\u002Fspan><h3 style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-.015em\">{{ g.title }}<\u002Fh3><\u002Fdiv>\n            <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                <li style=\"display:flex;gap:14px;padding:12px 0;border-top:1px solid rgba(6,19,74,.12);font-size:15.5px;line-height:1.5;color:#2a3147\"><span style=\"flex:none;width:5px;height:5px;background:#ec3b30;margin-top:9px\"><\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:clamp(72px,9vw,128px) 0;background:#fbfcfd;border-top:1px solid rgba(6,19,74,.08)\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(36px,4vw,56px)\">\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(30px,3.4vw,48px);line-height:1.05;letter-spacing:-.025em\">Related projects<\u002Fh2>\n        <a href=\"{{ disc.projHref }}\" style=\"display:flex;align-items:center;gap:10px;color:#06134a;text-decoration:none;font-weight:600;font-size:15px;padding-bottom:6px;border-bottom:1.5px solid #ec3b30\" style-hover=\"color:#021e7f\">All {{ disc.title }} projects<span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:48px 24px\">\n        <sc-for list=\"{{ related }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button data-reveal=\"\" sc-camel-on-click=\"{{ p.open }}\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-mouse-leave=\"{{ p.leave }}\" style=\"background:none;border:0;padding:0;text-align:left;cursor:pointer;color:#06134a;display:flex;flex-direction:column;gap:20px;min-width:0\">\n            <div style=\"position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;background:#0a1a5c\">\n              <sc-if value=\"{{ p.hasImg }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ p.img }}\" alt=\"{{ p.title }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale({{ p.zoom }});transition:transform 1.2s cubic-bezier(.2,.7,.2,1)\"><\u002Fsc-if>\n              <sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;inset:0;padding:28px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background-color:#0a1a5c;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)\">{{ p.discLabel }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:clamp(40px,4vw,60px);line-height:1;font-weight:500;letter-spacing:-.035em;color:#ec3b30\">{{ p.stat.v }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.8)\">{{ p.stat.l }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#021e7f\">{{ p.cat }}<\u002Fdiv>\n              <h3 style=\"margin:0;font-weight:500;font-size:22px;line-height:1.18;letter-spacing:-.015em;text-wrap:balance\">{{ p.title }}<\u002Fh3>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;color:#525a70\"><span>{{ p.place }}<\u002Fspan><span style=\"color:#06134a;transform:translateX({{ p.ax }});transition:transform .3s ease\">→<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ PROJECTS ============ -->\n<sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:sticky;top:129px;z-index:40;background:#fbfcfd;border-bottom:1px solid rgba(6,19,74,.12)\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:14px clamp(20px,5vw,64px);box-sizing:border-box;width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ filters }}\" as=\"fl\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ fl.pick }}\" style=\"height:40px;padding:0 16px;display:flex;align-items:center;gap:10px;border:1px solid {{ fl.bd }};background:{{ fl.bg }};color:{{ fl.fg }};font-weight:500;font-size:14px;cursor:pointer;border-radius:2px;transition:all .2s ease\">{{ fl.label }}<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.7\">{{ fl.count }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:#525a70\">SHOWING {{ shownCount }} PROJECTS<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <section style=\"padding:clamp(56px,7vw,96px) 0 clamp(80px,10vw,140px);background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:56px 24px\">\n        <sc-for list=\"{{ shown }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ p.open }}\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-mouse-leave=\"{{ p.leave }}\" style=\"background:none;border:0;padding:0;text-align:left;cursor:pointer;color:#06134a;display:flex;flex-direction:column;gap:20px;min-width:0\">\n            <div style=\"position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;background:#0a1a5c\">\n              <sc-if value=\"{{ p.hasImg }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ p.img }}\" alt=\"{{ p.title }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale({{ p.zoom }});transition:transform 1.2s cubic-bezier(.2,.7,.2,1)\"><\u002Fsc-if>\n              <sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;inset:0;padding:28px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background-color:#0a1a5c;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)\">{{ p.discLabel }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:clamp(40px,4vw,60px);line-height:1;font-weight:500;letter-spacing:-.035em;color:#ec3b30\">{{ p.stat.v }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.8)\">{{ p.stat.l }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#021e7f\"><span>{{ p.discLabel }}<\u002Fspan><span style=\"color:#8a90a3\">{{ p.cat }}<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0;font-weight:500;font-size:22px;line-height:1.18;letter-spacing:-.015em;text-wrap:balance\">{{ p.title }}<\u002Fh3>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;color:#525a70\"><span>{{ p.place }}<\u002Fspan><span style=\"color:#06134a;transform:translateX({{ p.ax }});transition:transform .3s ease\">→<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"margin-top:clamp(96px,11vw,160px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px clamp(40px,6vw,96px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Electrical studies<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(30px,3.4vw,48px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance\">Selected power system studies<\u002Fh2>\n          <p style=\"margin:0;font-size:16.5px;line-height:1.6;color:#525a70\">Arc flash, load flow, short circuit and protection coordination studies, typically modelled in ETAP.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0;border-top:1px solid rgba(6,19,74,.18)\">\n          <sc-for list=\"{{ studies }}\" as=\"sd\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 24px;padding:16px 0;border-bottom:1px solid rgba(6,19,74,.12)\"><span style=\"font-size:16.5px;font-weight:500\">{{ sd.s }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;color:#525a70;line-height:1.6\">{{ sd.t }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ CAREERS ============ -->\n<sc-if value=\"{{ isCareers }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"sec-why\" style=\"scroll-margin-top:129px;padding:clamp(80px,10vw,140px) 0;background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px clamp(40px,6vw,96px);align-items:start\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Why choose Algal<\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:28px;max-width:900px\">\n          <p style=\"margin:0;font-size:clamp(26px,2.8vw,40px);line-height:1.2;letter-spacing:-.022em;font-weight:500;text-wrap:pretty\">A diverse, open and collaborative environment where engineers grow alongside the company.<\u002Fp>\n          <p style=\"margin:0;font-size:18px;line-height:1.65;color:#525a70;text-wrap:pretty\">Our breadth of services means you can work across Building Services, Power Systems and Nuclear Engineering for both private and public sector clients. You will be involved at every stage, from initial studies through design to project close-out. Algal is an equal opportunity employer and welcomes engineers from all walks of life.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"sec-jobs\" style=\"scroll-margin-top:129px;background:#06134a;color:#fff;padding:clamp(80px,10vw,140px) 0\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(36px,4vw,56px)\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ec3b30\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Open positions<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:500;font-size:clamp(34px,4.2vw,60px);line-height:1.04;letter-spacing:-.028em\">Current opportunities<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:16.5px;color:rgba(255,255,255,.75)\">Send your resume to <a href=\"mailto:hr@algal.ca\" style=\"color:#ec3b30\">hr@algal.ca<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.16)\">\n        <sc-for list=\"{{ jobs }}\" as=\"j\" hint-placeholder-count=\"3\">\n          <a href=\"{{ j.href }}\" target=\"_blank\" rel=\"noopener\" data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;align-items:center;padding:clamp(24px,2.6vw,36px) 0;border-bottom:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none\" style-hover=\"color:#ec3b30\">\n            <span style=\"font-size:clamp(22px,2.2vw,30px);font-weight:500;letter-spacing:-.018em\">{{ j.t }}<\u002Fspan>\n            \n            <span style=\"justify-self:end;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center\">Job description (PDF)<span>↗<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"sec-students\" style=\"scroll-margin-top:129px;padding:clamp(80px,10vw,140px) 0;background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(56px,6vw,96px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"aspect-ratio:16/10;overflow:hidden;background:#0a1a5c\"><img src=\"https://www.algal.ca/Images/Services/bs-1.jpg\" alt=\"Student program\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\">Student &amp; co-op program<\u002Fdiv>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance\">We treat our students as future engineers.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:#525a70\">Our rotation program places students in each department (Building Services, Power Systems and Nuclear), so they experience every side of the business. Assignments include electrical design and schematics, report drafting, site visits, existing system analysis and client meetings. Many students return for further terms and go on to join us after graduation.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(6,19,74,.16)\">\n          <div style=\"padding:18px;border-right:1px solid rgba(6,19,74,.16);display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#021e7f\">ROTATION 01<\u002Fspan><span style=\"font-weight:600\">Building Services<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:18px;border-right:1px solid rgba(6,19,74,.16);display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#021e7f\">ROTATION 02<\u002Fspan><span style=\"font-weight:600\">Power Systems<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:18px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#021e7f\">ROTATION 03<\u002Fspan><span style=\"font-weight:600\">Nuclear<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"aspect-ratio:16/10;overflow:hidden;background:#0a1a5c\"><img src=\"https://www.algal.ca/Images/Services/n-1.jpg\" alt=\"Innovation at Algal\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\">The Innovation Box<\u002Fdiv>\n        <h2 style=\"margin:0;font-weight:500;font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance\">Every team member shapes how we work.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:#525a70\">The Innovation Box program is open to all suggestions, from office improvements to new technologies and methods for client work. It has led to new site-modelling software, new progress management systems and continuing professional development sessions on products we now specify in our designs.<\u002Fp>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:#525a70\">With Algal's work on OPG refurbishments and the new Small Modular Reactor project, you can play a part in a fast-changing energy sector.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ CONTACT ============ -->\n<sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"padding:clamp(72px,9vw,128px) 0;background:#f2f4f8\">\n    <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,64px);box-sizing:border-box;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(56px,6vw,112px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#021e7f\"><span style=\"width:28px;height:1px;background:currentColor\"><\u002Fspan>Send an inquiry<\u002Fdiv>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-
